<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email webinar | Hitachi Vantara</title>
<style>body{font:15px Arial,sans-serif;background:#f4f4f4;color:#222;margin:0;border-top:6px solid #fa000f}main{max-width:730px;margin:50px auto;padding:30px;background:white;border:1px solid #ddd}h1{font-weight:400}button,a.button{display:inline-block;background:#fa000f;color:white;border:0;padding:13px 18px;text-decoration:none;font-weight:bold;cursor:pointer;margin:8px 8px 8px 0}pre{white-space:pre-wrap;background:#f6f6f6;border:1px solid #ddd;padding:16px;font-family:inherit;line-height:1.5}p{line-height:1.5}</style>
</head><body><main><div>HITACHI VANTARA</div><h1>Email to customer / partner</h1><p id="status">Loading webinar…</p><div id="actions" hidden><button id="open">Open email in Outlook</button><button id="copy" style="background:#222">Copy email details</button><pre id="preview"></pre><p>This page opens outside SharePoint so the browser can hand the email to your configured Outlook application. No email is sent until you review and send it.</p></div></main>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id');
let mailto='',body='',subject='';
(async()=>{try{
 if(!id)throw Error('No content entry was selected.');
 const resp=await fetch('./webinars.json?ts='+Date.now(),{cache:'no-store'});
 if(!resp.ok)throw Error('Could not load the Webinar Hub.');
 const json=await resp.json(),it=(json.webinars||[]).find(x=>x.id===id);
 if(!it)throw Error('This webinar could not be found.');
 const title=(it.title||'a Hitachi Vantara resource').trim();
 subject='Thought this might be useful: '+title;
 const raw=(it.abstract||'').replace(/\s+/g,' ').trim();
 let summary=raw;
 if(summary.length>450){
   const chunk=summary.slice(0,450);
   const boundary=Math.max(chunk.lastIndexOf('. '),chunk.lastIndexOf('? '),chunk.lastIndexOf('! '));
   summary=chunk.slice(0,boundary>170?boundary+1:(chunk.lastIndexOf(' ')||450)).trim()+'…';
 }
 const type='webinar';
 if(!/^https?:\/\/\S+$/i.test(it.links?.watch||''))throw Error('This webinar has no valid watch / registration link to share.');
 const status=(it.status||'').toLowerCase();
 const isWebinar=true;
 const action=isWebinar?(status.includes('on demand')||status.includes('on-demand')?'Watch the webinar':'Register for the webinar'):'View the '+(it.type||'resource').toLowerCase();
 body=['Hi,','','I thought this resource might be relevant to your team.','',title,'',summary,'',action+': '+(it.links?.watch||''),'','Happy to discuss how this may apply to your organization.','','Best,'].filter((line,i,all)=>!(line===''&&all[i-1]==='')).join('\n');
 mailto='mailto:?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
 document.getElementById('status').textContent=it.title;
 document.getElementById('preview').textContent='Subject: '+subject+'\n\n'+body;
 document.getElementById('actions').hidden=false;
}catch(e){document.getElementById('status').textContent=e.message;}})();
document.getElementById('open').addEventListener('click',()=>{location.href=mailto});
document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText('Subject: '+subject+'\n\n'+body);document.getElementById('copy').textContent='Copied!'}catch(e){window.prompt('Copy email details:','Subject: '+subject+'\n\n'+body)}});
</script></body></html>

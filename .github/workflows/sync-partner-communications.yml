name: Sync partner communication templates
on:
  push:
    paths:
      - '.github/workflows/sync-partner-communications.yml'
      - 'sync_partner_communications.py'
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate partner email feed
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          PARTNER_COMMUNICATIONS_SHEET_ID: '4129244960739204'
        run: python3 sync_partner_communications.py
      - name: Commit updated feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pam-partner-submissions.json
          if ! git diff --cached --quiet; then
            git commit -m "Sync owner-confirmed partner communication templates"
            git push
          fi

name: Sync Webinar Activation Hub from Smartsheet

on:
  schedule:
    # Runs every 2 hours. Adjust the cron expression to change frequency.
    - cron: "0 */2 * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

permissions:
  contents: write  # needed so the workflow can commit webinars.json back to the repo

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Smartsheet sync
        env:
          SMARTSHEET_API_TOKEN: ${{ secrets.SMARTSHEET_API_TOKEN }}
          WEBINAR_REPORT_ID: ${{ secrets.WEBINAR_REPORT_ID }}
          CONTENT_SHEET_ID: ${{ secrets.CONTENT_SHEET_ID }}
          DEBUG_COLUMNS: "1"
        run: python sync_webinars.py

      - name: Commit updated webinars.json
        run: |
          git config user.name "webinar-hub-bot"
          git config user.email "actions@github.com"
          git add webinars.json
          git diff --quiet --cached || git commit -m "Auto-refresh webinar data from Smartsheet"
          git push

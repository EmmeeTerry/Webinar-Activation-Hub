<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Glove Program | Presentation</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#242424;background:#fff}*{box-sizing:border-box}
body{margin:0}main{max-width:1120px;margin:auto;padding:12px}
.viewer{background:#f5f5f5;border:1px solid #ddd;border-radius:8px;overflow:hidden}
.slide{position:relative;display:flex;align-items:center;justify-content:center;background:#181818;aspect-ratio:16/9;min-height:180px}
canvas{display:block;max-width:100%;max-height:100%;width:100%;height:auto;object-fit:contain}
#status{color:#fff;text-align:center;padding:24px;font-size:15px}#status[hidden]{display:none}
.controls{display:flex;align-items:center;justify-content:center;gap:12px;padding:12px;background:#fff;flex-wrap:wrap}
button{background:#fff;border:1px solid #ccc;border-radius:5px;padding:9px 14px;min-width:42px;font-size:16px;cursor:pointer}
button:hover{background:#f4f4f4}button:disabled{opacity:.3;cursor:default}
#counter{font-size:14px;min-width:76px;text-align:center}
.note{margin:8px 0;font-size:12px;color:#666;text-align:center}
:fullscreen main{max-width:100%;height:100%;display:flex;flex-direction:column;padding:0}
:fullscreen .viewer{flex:1;display:flex;flex-direction:column;border:0}
:fullscreen .slide{flex:1;aspect-ratio:auto;min-height:0}
:fullscreen canvas{width:auto;height:100%;max-width:100%}
@media(max-width:550px){main{padding:0}.viewer{border-radius:0;border-width:0}.controls{gap:7px;padding:8px}button{padding:8px}#counter{min-width:60px}}
</style>
</head>
<body>
<main id="shell">
<div class="viewer" aria-label="White Glove Program presentation">
<div class="slide"><canvas id="slideCanvas" aria-label="Presentation slide"></canvas><div id="status" role="status">Presentation will appear here once the approved PDF has been published.</div></div>
<div class="controls">
<button id="prev" type="button" aria-label="Previous slide" disabled>❮</button>
<span id="counter" aria-live="polite">0 of 0</span>
<button id="next" type="button" aria-label="Next slide" disabled>❯</button>
<button id="full" type="button" aria-label="Toggle full screen">⛶ Full screen</button>
</div></div>
<p class="note">Use the arrows or left/right keyboard keys to move between slides.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
'use strict';
const base = new URL('presentation.pdf', location.href);
const canvas=document.getElementById('slideCanvas'), status=document.getElementById('status');
const prev=document.getElementById('prev'), next=document.getElementById('next'), counter=document.getElementById('counter');
let pdf=null, pageNo=1, renderSeq=0;
if(!window.pdfjsLib){status.textContent='Unable to load the presentation viewer.';return;}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
function setControls(){const total=pdf?.numPages||0;counter.textContent=total?pageNo+' of '+total:'0 of 0';prev.disabled=!pdf||pageNo<=1;next.disabled=!pdf||pageNo>=total;}
async function render(){
 if(!pdf)return;const seq=++renderSeq;setControls();
 try{const page=await pdf.getPage(pageNo);if(seq!==renderSeq)return;
 const baseV=page.getViewport({scale:1});const width=Math.min(document.querySelector('.slide').clientWidth,1120);
 const cssScale=width/baseV.width;const dpr=Math.min(window.devicePixelRatio||1,2);
 const viewport=page.getViewport({scale:cssScale*dpr});
 canvas.width=Math.round(viewport.width);canvas.height=Math.round(viewport.height);
 canvas.style.width=Math.round(viewport.width/dpr)+'px';canvas.style.height=Math.round(viewport.height/dpr)+'px';
 await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
 if(seq===renderSeq){status.hidden=true;canvas.hidden=false;}
 }catch(e){status.hidden=false;status.textContent='Could not render this slide.';}
}
async function load(){
 try{const url=new URL(base);url.searchParams.set('v',Date.now().toString());
 pdf=await pdfjsLib.getDocument({url:url.href,withCredentials:false}).promise;
 pageNo=Math.min(pageNo,pdf.numPages);await render();
 }catch(e){status.hidden=false;status.textContent='Presentation not published yet. Add an approved presentation.pdf next to this viewer.';setControls();}
}
prev.addEventListener('click',()=>{if(pdf&&pageNo>1){pageNo--;render();}});
next.addEventListener('click',()=>{if(pdf&&pageNo<pdf.numPages){pageNo++;render();}});
document.getElementById('full').addEventListener('click',()=>{if(document.fullscreenElement)document.exitFullscreen();else document.getElementById('shell').requestFullscreen?.();});
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click();});
window.addEventListener('resize',()=>{if(pdf)render();});
document.addEventListener('fullscreenchange',()=>{if(pdf)setTimeout(render,100);});
load();
})();
</script>
</body>
</html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Build One Slide | Hitachi Vantara</title><style>body{margin:0;border-top:6px solid #cc0000;background:#f4f4f4;font:15px Arial,sans-serif;color:#222}main{max-width:700px;margin:48px auto;background:white;padding:30px;border:1px solid #ddd}a{color:#c00}</style></head><body><main><strong style="color:#c00">HITACHI VANTARA</strong><h1>Build One Slide</h1><p id="status">Preparing your slide using the shared Calendar design…</p></main><script>
(async()=>{const status=document.getElementById('status');try{
 const p=new URLSearchParams(location.search);const id=p.get('id');const webinar=p.get('source')==='webinar';if(!id)throw Error('No webinar or content entry was selected.');
 const response=await fetch(webinar?'./webinars.json':'./content.json',{cache:'no-store'});if(!response.ok)throw Error('Could not read the source library data.');
 const data=await response.json();const entry=(webinar?data.webinars:data.items||[]).find(x=>String(x.id)===id);if(!entry)throw Error('The selected entry was not found.');
 const url=webinar?entry.links?.watch:entry.url;
 const fields={source:'content',title:entry.title||'',date:webinar?(entry.dateDisplay||entry.date||''):(entry.publishDateDisplay||entry.publishDate||''),description:entry.abstract||entry.notes||'',category:webinar?'Webinar':(entry.type||'Content'),geo:entry.region||'',campaign:entry.campaign||'',salesPlay:entry.useCase||'',owner:entry.owner||entry.ownerIndividual||'',audience:entry.audience||'',url:/^https?:\/\/\S+$/i.test(url||'')?url:''};
 const channels=[];
 const resources=[];
 const safeUrl=value=>typeof value==='string' && /^https:\/\/[^\s]+$/i.test(value.trim())?value.trim():'';
 const add=(label, value)=>{
   if(!value)return;
   const link = safeUrl(value);
   if (value !== true && !link) return;
   if (resources.some(resource => resource.label === label && resource.url === link)) return;
   channels.push(label);
   resources.push({label,url:link});
 };
 if(webinar){
   add('Marketing email',entry.links?.marketingEmail);
   add('Sales outreach',entry.links?.salesEmail);
   add('SDR follow-up',entry.links?.sdrEmail);
   add('Paid social',entry.links?.paidSocial);
   add('Organic social',entry.links?.social);
   add('Partner campaign',entry.links?.partnerCampaign);
   add('Attendee report',entry.links?.attendance);
   for (const resource of entry.relatedResources || []) {
     if (safeUrl(resource.url)) add(resource.title || 'Related campaign resource', resource.url);
   }
 }else{
   const dates = new Map((entry.promotionDates || []).map(({channel,date}) => [channel.toLowerCase(),date]));
   const plans = (entry.primaryActivation || '').split(/[,;\n]+/).map(value => value.trim()).filter(Boolean);
   const paidSocial = ['Paid social ads', entry.paidSocialAds];
   const sales = ['Sales outreach email', entry.salesEmail];
   const outbound = ['Enterprise Marketo email preview', entry.marketoPreviewEnterprise];
   const partner = ['Partner campaign', entry.partnerCampaignLink];
   const aliases = new Map([
     ['paid social', paidSocial], ['paid social ads', paidSocial],
     ['sales email', sales], ['sales outreach email', sales],
     ['outbound email', outbound], ['enterprise outbound email', outbound],
     ['enterprise outbound email banner', outbound], ['enterprise marketo email preview', outbound],
     ['partner activation', partner], ['partner campaign', partner],
     ['sdr email cadence', ['SDR follow-up email', entry.sdrEmail, 'sdr activation']],
     ['sdr follow-up email', ['SDR follow-up email', entry.sdrEmail, 'sdr activation']],
     ['nurture email', ['Nurture email', '', 'email nurture']],
     ['paid search', ['Paid Search', '', 'paid search (sem)']],
     ['bytesize', ['Bytesize', '', 'bytesize promotion']],
     ['campaign landing page', ['Campaign Landing Page', '', 'web / landing page']],
   ]);
   const seen = new Set();
   for (const plan of plans) {
     const key = plan.toLowerCase();
     if (/^(no planned promotion|none|n\/?a|tbc|tbd|paid media)$/.test(key)) continue;
     const [label, link, dateKey = key] = aliases.get(key) || [plan];
     const canonical = label.toLowerCase();
     const url = safeUrl(link);
     if (seen.has(canonical) || (label === outbound[0] && !url)) continue;
     seen.add(canonical);
     const date = dates.get(dateKey);
     add(date ? label + ': ' + date : label, url || true);
   }
   if (!seen.has('partner campaign')) add('Partner campaign',entry.partnerCampaignLink);
   const paidDate = dates.get('paid media') || entry.paidMediaDateDisplay;
   if (paidDate) {
     resources.push({label:'Paid media: ' + paidDate,date:true,url:''});
   } else if (plans.some(plan => plan.toLowerCase() === 'paid media')) {
     add('Paid media',true);
   }
 }
 const paidArtwork = safeUrl(webinar ? entry.links?.paidSocial : resources.find(resource => resource.label.startsWith('Paid social ads'))?.url);
 const directAdImage = /\.(?:gif|png|jpe?g|webp|bmp|avif)(?:[?#]|$)/i.test(paidArtwork) ? paidArtwork : '';
 fields.paidArtwork = paidArtwork;
 fields.visualCandidates = JSON.stringify([...new Set([directAdImage, entry.webinarImage, entry.marketoOutboundImage].filter(safeUrl))]);
 fields.promotion=channels.join(' • ');
 fields.promotionResources=JSON.stringify(resources);
 fields.promotionPeriod=webinar?'':(entry.promotionPeriod||'');
 fields.promotionLabel=webinar?'PROMOTION RESOURCES AVAILABLE':'PLANNED PROMOTION / ACTIVATION';
 const hash=new URLSearchParams(fields).toString();
 location.replace('./event-slide.html?v=20261112-3#'+hash);
}catch(err){status.textContent='Unable to prepare slide: '+err.message;}})();
</script></body></html>
